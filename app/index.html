<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <h1>Vice Cover Studio</h1>
  <p>Turn a photo into GTA-style multi-panel cover art, then export a PNG to share.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Editor controls">
    <h2>Photo</h2>
    <label class="file">Choose a photo <input id="photo" type="file" accept="image/*"></label>
    <p class="hint">Or drop a photo (or three) onto the preview.</p>
    <label class="check"><input id="span" type="checkbox" checked> One photo across all panels</label>
    <div id="panelPhotos" class="panel-photos" hidden>
      <label id="pp0">Panel 1 <input id="photo0" type="file" accept="image/*"></label>
      <label id="pp1">Panel 2 <input id="photo1" type="file" accept="image/*"></label>
      <label id="pp2">Panel 3 <input id="photo2" type="file" accept="image/*"></label>
    </div>

    <h2>Layout</h2>
    <div class="seg" id="layoutSeg">
      <button type="button" data-layout="solo">Solo</button>
      <button type="button" data-layout="duo">Duo</button>
      <button type="button" data-layout="trio" class="on">Trio</button>
    </div>

    <h2>Selected panel</h2>
    <p class="hint">Click a panel in the preview, then drag it to move the photo.</p>
    <label>Zoom <input id="zoom" type="range" min="0.6" max="3" step="0.05" value="1"></label>
    <label>Move left–right <input id="ox" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
    <label>Move up–down <input id="oy" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>

    <h2>Caption</h2>
    <label>Caption <input id="caption" type="text" maxlength="40" value="VICE HEAT"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="A SUNSET STORY"></label>
    <div class="seg" id="posSeg">
      <button type="button" data-pos="top">Top</button>
      <button type="button" data-pos="bottom" class="on">Bottom</button>
    </div>
    <label>Lettering size <input id="capSize" type="range" min="0.6" max="1.6" step="0.05" value="1"></label>

    <h2>Colour grade</h2>
    <div class="seg" id="gradeSeg">
      <button type="button" data-grade="sunset" class="on">Sunset</button>
      <button type="button" data-grade="neon">Neon</button>
      <button type="button" data-grade="noir">Noir</button>
      <button type="button" data-grade="vice">Vice</button>
    </div>

    <h2>Export PNG</h2>
    <div class="export">
      <button type="button" data-size="1080x1080">1080 × 1080</button>
      <button type="button" data-size="1080x1350">1080 × 1350</button>
      <button type="button" data-size="1920x1080">1920 × 1080</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" id="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="Live cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
